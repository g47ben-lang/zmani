name: Download songs

# Downloads songs from SoundCloud (search by name), zips them, and uploads
# songs.zip as an artifact to grab from the run page.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/music-upload-script-ebrvui
    paths:
      - songs.txt
      - .github/workflows/download.yml

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip

      - name: Download songs (SoundCloud)
        env:
          SOURCES: "sc"
          DEBUG_SOURCES: "1"
        run: |
          python3 download_songs.py --list songs.txt --out ./downloads 2>&1 | tee run.log || true

      - name: Zip results
        run: |
          cd downloads && zip -r -0 ../songs.zip . && cd ..
          ls -la songs.zip || echo "no zip (nothing downloaded)"

      - name: Upload songs.zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songs
          path: songs.zip
          if-no-files-found: ignore
