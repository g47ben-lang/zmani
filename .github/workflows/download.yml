name: Download songs

# Downloads songs from YouTube through a residential proxy (PROXY_URL secret),
# so YouTube treats the request like a normal home user. Zips the results and
# uploads songs.zip as an artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/music-upload-script-ebrvui
    paths:
      - songs.txt
      - .github/workflows/download.yml

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip

      - name: Download songs (YouTube via residential proxy)
        env:
          SOURCES: "yt"
          YTDLP_PROXY: ${{ secrets.PROXY_URL }}
          DEBUG_SOURCES: "1"
        run: |
          if [ -z "$YTDLP_PROXY" ]; then echo "::error::PROXY_URL secret is not set."; exit 1; fi
          python3 download_songs.py --list songs.txt --out ./downloads 2>&1 | tee run.log || true

      - name: Zip results
        run: |
          # Only bundle the audio files — skip any leftover thumbnails/images.
          cd downloads && (zip -0 ../songs.zip *.mp3 *.m4a *.opus 2>/dev/null || echo "no audio files") && cd ..
          ls -la songs.zip || echo "no zip (nothing downloaded)"

      - name: Upload songs.zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songs
          path: songs.zip
          if-no-files-found: ignore
