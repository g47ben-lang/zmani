name: Download songs

# Downloads songs from YouTube through a residential proxy (PROXY_URL secret),
# so YouTube treats the request like a normal home user. Zips the results and
# uploads songs.zip as an artifact.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to download"
        type: choice
        default: audio
        options: [audio, video]
      video_res:
        description: "Max video height (video mode), e.g. 720 or 1080"
        default: "1080"
  push:
    branches:
      - claude/music-upload-script-ebrvui
      - claude/youtube-downloader-add-songs-njp0gy
    paths:
      - songs.txt
      - .github/workflows/download.yml

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip

      - name: Download songs (YouTube via residential proxy)
        env:
          SOURCES: "yt"
          YTDLP_PROXY: ${{ secrets.PROXY_URL }}
          DEBUG_SOURCES: "1"
          # workflow_dispatch lets you pick audio/video; a plain push defaults to audio.
          VIDEO: ${{ github.event.inputs.mode == 'video' && '1' || '' }}
          VIDEO_RES: ${{ github.event.inputs.video_res }}
        run: |
          if [ -z "$YTDLP_PROXY" ]; then echo "::error::PROXY_URL secret is not set."; exit 1; fi
          python3 download_songs.py --list songs.txt --out ./downloads 2>&1 | tee run.log || true

      - name: Zip results
        run: |
          # Bundle audio and/or video files — skip leftover thumbnails/images.
          cd downloads && (zip -0 ../songs.zip *.mp3 *.m4a *.opus *.mp4 *.mkv *.webm 2>/dev/null || echo "no media files") && cd ..
          ls -la songs.zip || echo "no zip (nothing downloaded)"

      - name: Upload songs.zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songs
          path: songs.zip
          if-no-files-found: ignore
