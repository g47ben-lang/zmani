name: Download songs

# Downloads the songs from YouTube using an authenticated cookies file
# (decrypted at runtime from cookies.enc via the COOKIES_KEY secret), zips
# them, and uploads songs.zip as an artifact to grab from the run page.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/music-upload-script-ebrvui
    paths:
      - songs.txt
      - .github/workflows/download.yml

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip

      - name: Start PO-token provider
        run: |
          # Cookies get us past the bot check; the PO token unlocks the media
          # format URLs ("Requested format is not available" without it).
          docker run --name bgutil -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          sleep 15

      - name: Decrypt YouTube cookies
        env:
          COOKIES_KEY: ${{ secrets.COOKIES_KEY }}
        run: |
          if [ -z "$COOKIES_KEY" ]; then
            echo "::error::COOKIES_KEY secret is not set."; exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass pass:"$COOKIES_KEY" -in cookies.enc -out cookies.txt
          echo "Decrypted cookies: $(wc -l < cookies.txt) lines."

      - name: Download songs (YouTube)
        env:
          SOURCES: "yt"
          YTDLP_COOKIES: "cookies.txt"
          DEBUG_SOURCES: "1"
        run: |
          # Don't fail the whole job if some individual songs fail.
          python3 download_songs.py --list songs.txt --out ./downloads 2>&1 | tee run.log || true
          rm -f cookies.txt   # never keep the decrypted cookies around

      - name: Zip results
        run: |
          cd downloads && zip -r -0 ../songs.zip . && cd ..
          ls -la songs.zip || echo "no zip (nothing downloaded)"

      - name: Upload songs.zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songs
          path: songs.zip
          if-no-files-found: ignore
