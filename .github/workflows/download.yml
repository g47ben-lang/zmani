name: Download songs

# Downloads songs from YouTube through a residential proxy (so YouTube treats
# the request like a normal home user), zips them, and uploads songs.zip as an
# artifact. Cookies are used too when available for extra reliability.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/music-upload-script-ebrvui
    paths:
      - songs.txt
      - .github/workflows/download.yml

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip

      - name: Decrypt YouTube cookies (optional)
        env:
          COOKIES_KEY: ${{ secrets.COOKIES_KEY }}
        run: |
          if [ -n "$COOKIES_KEY" ] && [ -f cookies.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass pass:"$COOKIES_KEY" -in cookies.enc -out cookies.txt \
              && echo "cookies ready" || echo "cookie decrypt failed; continuing without"
          else
            echo "no cookies configured; continuing without"
          fi

      - name: Download songs (YouTube via proxy)
        env:
          SOURCES: "yt"
          YTDLP_PROXY: ${{ secrets.PROXY_URL }}
          YTDLP_COOKIES: "cookies.txt"
          DEBUG_SOURCES: "1"
        run: |
          if [ -z "$YTDLP_PROXY" ]; then echo "::error::PROXY_URL secret is not set."; exit 1; fi
          python3 download_songs.py --list songs.txt --out ./downloads 2>&1 | tee run.log || true
          rm -f cookies.txt

      - name: Zip results
        run: |
          cd downloads && zip -r -0 ../songs.zip . && cd ..
          ls -la songs.zip || echo "no zip (nothing downloaded)"

      - name: Upload songs.zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songs
          path: songs.zip
          if-no-files-found: ignore
