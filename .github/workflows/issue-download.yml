name: Download songs from issue

# Self-service "website": open an issue with the "🎵 הורדה" form, paste a list,
# and pick song (MP3) or video (MP4). This parses the form, downloads the items
# from YouTube through the residential proxy (PROXY_URL secret), zips them,
# uploads the zip as an artifact, and comments back with the download link.
# Reopen the issue to run it again.
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: read
  issues: write

jobs:
  download:
    # Only the repo owner can trigger this (keeps random visitors on a public
    # repo from starting downloads). We recognize a download request by the
    # form's marker text OR the "songs" label — NOT the label alone, because a
    # brand-new repo may not have the label yet (issue forms silently skip
    # labels that don't exist), which would otherwise skip every run.
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      (
        contains(github.event.issue.labels.*.name, 'songs') ||
        contains(github.event.issue.title, 'הורדה') ||
        contains(github.event.issue.body, 'מה להוריד') ||
        contains(github.event.issue.body, 'הרשימה')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Acknowledge (comment "started")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue comment "${{ github.event.issue.number }}" \
            --body "⏳ התחלתי… זה ייקח כמה דקות. מעקב: $RUN_URL"

      - name: Parse the issue form (list + audio/video choice)
        run: |
          python3 - <<'PY'
          import json, os, re

          event = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          body = (event["issue"]["body"] or "").replace("\r\n", "\n")

          # Issue forms render as: "### <label>\n\n<value>\n\n### <label>...".
          # Split into (heading -> value) sections. If there are no headings
          # (an old plain-text issue), treat the whole body as the song list.
          sections, cur, buf = {}, None, []
          for line in body.split("\n"):
              m = re.match(r"^###\s+(.*)", line)
              if m:
                  if cur is not None:
                      sections[cur] = "\n".join(buf).strip()
                  cur, buf = m.group(1).strip(), []
              elif cur is not None:
                  buf.append(line)
          if cur is not None:
              sections[cur] = "\n".join(buf).strip()

          def find(keyword):
              for k, v in sections.items():
                  if keyword in k:
                      return v
              return ""

          if sections:
              fmt  = find("להוריד")                         # "מה להוריד?"
              res  = find("איכות")                          # video resolution
              mind = find("אורך")                           # min length dropdown
              lst  = find("הרשימה") or find("פריט") or ""    # the list textarea
          else:
              fmt, res, mind, lst = "", "", "", body

          video = ("סרטון" in fmt) or ("MP4" in fmt) or ("mp4" in fmt.lower())
          res_digits = re.search(r"\d{3,4}", res)
          res = res_digits.group(0) if res_digits else "1080"

          # Minimum length: the dropdown reads like "לפחות 10 דקות" / "לפחות שעה"
          # / "בלי הגבלה". Convert to seconds (0 = no limit).
          if "שעה" in mind:
              min_dur = 3600
          else:
              mm = re.search(r"\d+", mind)
              min_dur = int(mm.group(0)) * 60 if mm else 0

          # "_No response_" is what GitHub inserts for an empty optional field.
          if lst.strip() == "_No response_":
              lst = ""

          with open("songs.txt", "w", encoding="utf-8") as f:
              f.write(lst.strip() + "\n")

          count = sum(1 for ln in lst.splitlines()
                      if ln.strip() and not ln.strip().startswith("#"))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"VIDEO={'1' if video else ''}\n")
              env.write(f"VIDEO_RES={res}\n")
              env.write(f"MIN_DURATION={min_dur}\n")
              env.write(f"MODE={'video' if video else 'audio'}\n")
              env.write(f"song_count={count}\n")

          print(f"mode={'video' if video else 'audio'} res={res} min_dur={min_dur} count={count}")
          print("----- first lines -----")
          print("\n".join(lst.splitlines()[:10]))
          PY

      - name: Install tools
        run: |
          python3 -m pip install --upgrade yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg zip

      - name: Download (YouTube via residential proxy)
        env:
          SOURCES: "yt"
          YTDLP_PROXY: ${{ secrets.PROXY_URL }}
          DEBUG_SOURCES: "1"
          # VIDEO / VIDEO_RES / MIN_DURATION come from the parse step (GITHUB_ENV).
        run: |
          if [ -z "$YTDLP_PROXY" ]; then echo "::error::PROXY_URL secret is not set."; exit 1; fi
          python3 download_songs.py --list songs.txt --out ./downloads 2>&1 | tee run.log || true

      - name: Zip results
        run: |
          cd downloads && (zip -0 ../songs.zip *.mp3 *.m4a *.opus *.mp4 *.mkv *.webm 2>/dev/null || echo "no media files") && cd ..
          ls -la songs.zip || echo "no zip"

      - name: Upload songs.zip artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: songs
          path: songs.zip
          if-no-files-found: ignore

      - name: Comment result on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OK=$(ls downloads/*.mp3 downloads/*.mp4 downloads/*.m4a downloads/*.webm downloads/*.mkv 2>/dev/null | wc -l | tr -d ' ')
          KIND=$([ "$MODE" = "video" ] && echo "סרטונים" || echo "שירים")
          if [ "${OK:-0}" -gt 0 ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "$(printf '✅ מוכן! ירדו %s %s.\n\n**להורדה:** פתח את הקישור, גלול למטה ל-**Artifacts** והורד את `songs.zip`:\n%s\n\nאפשר לסגור את ה-Issue.' "$OK" "$KIND" "$RUN_URL")"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "$(printf '⚠️ לא ירד כלום. בדוק את הרשימה או צפה בפירוט כאן: %s' "$RUN_URL")"
          fi
